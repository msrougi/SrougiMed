name: ChatMed attachments checks
on:
  push:
    branches: [chatmed-emoji-anexos]
  pull_request:
    paths:
      - "server/**"
      - "shared/**"
      - "client/public/chatmed-sw.js"
      - "client/src/components/ChatAlerts.tsx"
      - "client/src/lib/chatAlerts*"
      - "client/src/components/PhoneBookForm.tsx"
      - "client/src/lib/phoneBookForm.test.tsx"
      - "client/src/pages/Login.tsx"
      - "client/src/components/AdminPanel.tsx"
      - "client/src/lib/networkLogin.test.tsx"
      - "server/chatMed*"
      - "server/chatFile*"
      - "server/prepareChatMed.ts"
      - "shared/chat*"
      - "client/src/components/ChatMed.tsx"
      - "client/src/components/ChatEmojiPicker.tsx"
      - "client/src/lib/chatEmojiPicker.test.tsx"
      - "client/src/lib/chatMed.test.tsx"
      - "client/src/lib/chatEmojiText.ts"
      - ".github/workflows/chatmed-attachments.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-only
          MYSQL_DATABASE: srougi_test_chatmed
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare isolated authentication databases
        run: docker exec ${{ job.services.mysql.id }} mysql -uroot -psynthetic-ci-only -e "CREATE DATABASE srougi_test_network; CREATE DATABASE srougi_test_devices; CREATE DATABASE srougi_test_sort; CREATE DATABASE srougi_test_push;"
      - run: pnpm check
      - run: pnpm test
        env:
          SROUGI_NETWORK_TEST_DATABASE_URL: mysql://root:synthetic-ci-only@127.0.0.1:3306/srougi_test_network
          SROUGI_DEVICE_TEST_DATABASE_URL: mysql://root:synthetic-ci-only@127.0.0.1:3306/srougi_test_devices
          SROUGI_SORT_TEST_DATABASE_URL: mysql://root:synthetic-ci-only@127.0.0.1:3306/srougi_test_sort
          SROUGI_CHAT_TEST_DATABASE_URL: mysql://root:synthetic-ci-only@127.0.0.1:3306/srougi_test_chatmed
          SROUGI_PUSH_TEST_DATABASE_URL: mysql://root:synthetic-ci-only@127.0.0.1:3306/srougi_test_push
      - run: pnpm build
